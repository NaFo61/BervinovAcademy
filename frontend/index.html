<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="app-base" content="" />
<title>Bervinov Academy · ЕГЭ-информатика</title>
<link rel="stylesheet" href="tailwind.css" />
<style>
  :root {
    --c-1: #1D4ED8;   /* blue 700 — deep */
    --c-2: #2563EB;   /* blue 600 — primary */
    --c-3: #0EA5E9;   /* sky 500 */
    --c-4: #06B6D4;   /* cyan 500 */
    --c-5: #22D3EE;   /* cyan 400 — bright */
    --paper: #F6F8FC;
    --ink: #0B1226;
  }
  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
  }
  ::selection { background: rgba(37, 99, 235, 0.18); color: var(--ink); }

  /* Dark code surfaces: selection must stay light-on-dark */
  .code-bg ::selection,
  .chat-code-block ::selection,
  .chat-code-block code ::selection,
  .theory-content pre ::selection,
  .theory-content pre code ::selection,
  textarea.code-bg ::selection,
  .monaco-editor .view-lines ::selection {
    background: rgba(56, 189, 248, 0.45);
    color: #f8fafc;
  }

  /* ---- Primary surfaces & gradients ---- */
  .grad-text {
    background: linear-gradient(95deg, var(--c-1) 0%, var(--c-2) 40%, var(--c-3) 70%, var(--c-5) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .grad-bg {
    background: linear-gradient(135deg, var(--c-1) 0%, var(--c-2) 35%, var(--c-3) 75%, var(--c-5) 100%);
  }
  .grad-bg-soft {
    background: linear-gradient(135deg, rgba(37,99,235,0.10) 0%, rgba(14,165,233,0.08) 50%, rgba(34,211,238,0.10) 100%);
  }
  .grad-border {
    background: linear-gradient(white, white) padding-box,
                linear-gradient(135deg, var(--c-2), var(--c-4)) border-box;
    border: 1px solid transparent;
  }

  /* ---- Rich page backgrounds ---- */
  /* HERO mesh: layered radial blobs + dot grid + faint diagonal lines */
  .mesh-bg {
    position: relative;
    background-color: var(--paper);
    background-image:
      radial-gradient(at 14% 10%, rgba(37,99,235,0.30) 0px, transparent 45%),
      radial-gradient(at 88% 16%, rgba(34,211,238,0.28) 0px, transparent 48%),
      radial-gradient(at 70% 90%, rgba(14,165,233,0.22) 0px, transparent 55%),
      radial-gradient(at 8% 88%, rgba(99,102,241,0.18) 0px, transparent 50%);
  }
  .mesh-bg::before {
    /* fine dot grid */
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(11,18,38,0.10) 1px, transparent 1px);
    background-size: 22px 22px;
    mask-image: linear-gradient(180deg, rgba(0,0,0,0.7), rgba(0,0,0,0.25) 60%, transparent);
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.7), rgba(0,0,0,0.25) 60%, transparent);
    opacity: 0.6;
  }
  .mesh-bg::after {
    /* faint diagonal lines */
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image: repeating-linear-gradient(135deg, rgba(37,99,235,0.05) 0 2px, transparent 2px 80px);
    mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 75%);
  }

  .mesh-bg-dim {
    position: relative;
    background-color: var(--paper);
    background-image:
      radial-gradient(at 8% 0%, rgba(37,99,235,0.14) 0px, transparent 45%),
      radial-gradient(at 100% 0%, rgba(34,211,238,0.12) 0px, transparent 45%);
  }
  .mesh-bg-dim::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(11,18,38,0.07) 1px, transparent 1px);
    background-size: 24px 24px;
    mask-image: linear-gradient(180deg, rgba(0,0,0,0.55), transparent 70%);
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.55), transparent 70%);
  }

  /* large slow-drifting aurora blobs (placed into FloatingShapes) */
  .aurora {
    position: absolute; border-radius: 50%; filter: blur(48px);
    mix-blend-mode: multiply;
    will-change: transform;
    animation: drift 24s ease-in-out infinite;
  }
  .aurora-conic {
    position: absolute; inset: -20%;
    background: conic-gradient(from 90deg at 50% 50%,
      rgba(37,99,235,0.10), rgba(14,165,233,0.04),
      rgba(34,211,238,0.10), rgba(37,99,235,0.04),
      rgba(37,99,235,0.10));
    filter: blur(60px);
    animation: spinSlow 90s linear infinite;
    opacity: 0.7;
    pointer-events: none;
  }

  /* ---- UI atoms ---- */
  .scrollbar-thin::-webkit-scrollbar { width: 8px; height: 8px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(37,99,235,0.20); border-radius: 999px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }

  .btn-grad {
    background: linear-gradient(90deg, var(--c-1) 0%, var(--c-2) 35%, var(--c-3) 70%, var(--c-4) 100%);
    background-size: 200% 100%;
    transition: background-position 700ms ease;
  }
  .btn-grad:hover { background-position: 100% 0; }
  .btn-shimmer { position: relative; overflow: hidden; }
  .btn-shimmer::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.40) 50%, transparent 70%);
    transform: translateX(-100%);
    transition: transform 700ms ease;
  }
  .btn-shimmer:hover::after { transform: translateX(100%); }

  .glass {
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.6);
  }

  /* ---- Site header (TopNav) — full-bleed, no cramped floating card ---- */
  .site-header {
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    border-bottom: 1px solid rgba(11, 18, 38, 0.08);
  }
  .site-header--scrolled {
    background: rgba(255, 255, 255, 0.97);
    box-shadow: 0 8px 24px -20px rgba(11, 18, 38, 0.35);
  }
  .site-header__inner {
    max-width: 80rem;
    margin: 0 auto;
    height: 3.5rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0 1rem;
  }
  @media (min-width: 640px) {
    .site-header__inner { padding: 0 1.5rem; gap: 1rem; }
  }
  .site-header__mark {
    display: inline-flex; align-items: center; justify-content: center;
    width: 2.25rem; height: 2.25rem; border-radius: 12px;
    background: linear-gradient(145deg, rgba(37,99,235,0.14), rgba(34,211,238,0.16));
  }
  .site-header__nav {
    display: none;
    align-items: center;
    gap: 0.15rem;
    min-width: 0;
  }
  @media (min-width: 1280px) {
    .site-header__nav { display: flex; }
  }
  .site-header__nav-item {
    position: relative;
    padding: 0.4rem 0.65rem;
    border-radius: 8px;
    font-size: 0.8125rem;
    font-weight: 600;
    line-height: 1.2;
    color: rgba(11,18,38,0.58);
    white-space: nowrap;
    transition: color 140ms ease, background 140ms ease;
  }
  .site-header__nav-item:hover {
    color: var(--ink);
    background: rgba(11,18,38,0.04);
  }
  .site-header__nav-item.is-active {
    color: #1D4ED8;
    background: transparent;
    box-shadow: none;
  }
  .site-header__nav-item.is-active::after {
    content: '';
    position: absolute;
    left: 0.65rem;
    right: 0.65rem;
    bottom: 0.15rem;
    height: 2px;
    border-radius: 99px;
    background: #2563EB;
  }
  .site-header__search {
    display: none;
    align-items: center;
    gap: 0.5rem;
    height: 2.25rem;
    padding: 0 0.75rem;
    width: 11rem;
    border-radius: 10px;
    background: rgba(11, 18, 38, 0.035);
    border: 1px solid rgba(11, 18, 38, 0.08);
    transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
  }
  @media (min-width: 1280px) {
    .site-header__search { display: flex; width: 13rem; }
  }
  @media (min-width: 1536px) {
    .site-header__search { width: 16rem; }
  }
  .site-header__search:focus-within {
    background: #fff;
    border-color: rgba(37,99,235,0.4);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
  }
  .site-header__icon-btn {
    width: 2.75rem; height: 2.75rem; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    color: rgba(11,18,38,0.62);
    transition: background 140ms ease, color 140ms ease;
  }
  @media (min-width: 640px) {
    .site-header__icon-btn { width: 2.25rem; height: 2.25rem; }
  }
  .site-header__icon-btn:hover { background: rgba(11,18,38,0.05); color: var(--ink); }
  .site-header__icon-btn.is-active {
    background: rgba(37,99,235,0.1);
    color: #1D4ED8;
  }
  .site-header__burger {
    width: 18px; height: 14px; position: relative; display: block;
  }
  .site-header__burger span {
    position: absolute; left: 0; right: 0; height: 2px; border-radius: 99px;
    background: currentColor; transition: transform 220ms ease, opacity 180ms ease, top 220ms ease;
  }
  .site-header__burger span:nth-child(1) { top: 0; }
  .site-header__burger span:nth-child(2) { top: 6px; }
  .site-header__burger span:nth-child(3) { top: 12px; }
  .site-header__burger[data-open="1"] span:nth-child(1) { top: 6px; transform: rotate(45deg); }
  .site-header__burger[data-open="1"] span:nth-child(2) { opacity: 0; }
  .site-header__burger[data-open="1"] span:nth-child(3) { top: 6px; transform: rotate(-45deg); }
  .site-header__panel {
    border-top: 1px solid rgba(11, 18, 38, 0.06);
    background: #fff;
    padding: 0.75rem 1rem 1rem;
  }
  @media (min-width: 640px) {
    .site-header__panel { padding-left: 1.5rem; padding-right: 1.5rem; }
  }
  @media (min-width: 1280px) {
    .site-header__menu-btn { display: none !important; }
  }
  .site-header__user {
    position: relative;
  }
  .site-header__user-trigger {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    height: 2.25rem;
    padding: 0 0.35rem 0 0.25rem;
    border-radius: 999px;
    transition: background 140ms ease;
  }
  .site-header__user-trigger:hover,
  .site-header__user-trigger[aria-expanded="true"] {
    background: rgba(11, 18, 38, 0.05);
  }
  .site-header__user-menu {
    position: absolute;
    right: 0;
    top: calc(100% + 0.45rem);
    width: min(18.5rem, calc(100vw - 1.5rem));
    padding: 0.4rem;
    border-radius: 16px;
    background: #fff;
    border: 1px solid rgba(11, 18, 38, 0.08);
    box-shadow:
      0 18px 40px -24px rgba(11, 18, 38, 0.45),
      0 8px 20px -14px rgba(37, 99, 235, 0.25);
    z-index: 60;
    animation: headerMenuIn 140ms ease-out;
  }
  @keyframes headerMenuIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .site-header__user-head {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.7rem 0.75rem 0.8rem;
    margin-bottom: 0.2rem;
    border-bottom: 1px solid rgba(11, 18, 38, 0.06);
  }
  .site-header__user-item {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    width: 100%;
    min-height: 2.4rem;
    padding: 0.45rem 0.7rem;
    border-radius: 10px;
    font-size: 0.875rem;
    font-weight: 600;
    color: rgba(11, 18, 38, 0.78);
    text-align: left;
    transition: background 120ms ease, color 120ms ease;
  }
  .site-header__user-item:hover {
    background: rgba(11, 18, 38, 0.04);
    color: var(--ink);
  }
  .site-header__user-item.is-active {
    background: rgba(37, 99, 235, 0.08);
    color: #1D4ED8;
  }
  .site-header__user-item.is-danger {
    color: #e11d48;
  }
  .site-header__user-item.is-danger:hover {
    background: rgba(244, 63, 94, 0.08);
    color: #be123c;
  }
  .site-header__user-sep {
    height: 1px;
    margin: 0.3rem 0.4rem;
    background: rgba(11, 18, 38, 0.06);
  }
  .site-header__user-ico {
    width: 1.15rem;
    height: 1.15rem;
    flex-shrink: 0;
    opacity: 0.72;
  }
  .glass-dark {
    background: rgba(11, 18, 38, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .code-bg {
    background: #0B1226;
    color: #E2E8F0;
  }
  .code-bg ::selection {
    background: rgba(56, 189, 248, 0.45);
    color: #f8fafc;
  }

  .check-dot {
    width: 16px; height: 16px; border-radius: 999px;
    background: linear-gradient(135deg, #22C55E, #16A34A);
    box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.12);
  }
  .cross-dot {
    width: 16px; height: 16px; border-radius: 999px;
    background: linear-gradient(135deg, #EF4444, #DC2626);
    box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.12);
  }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }

  /* ── Theory lesson prose ── */
  .theory-content { font-size: 15px; line-height: 1.8; color: rgba(11,18,38,0.82); }
  .theory-content h1 { font-size: 1.65rem; font-weight: 800; margin: 0 0 0.75rem; color: #0B1226; }
  .theory-content h2 { font-size: 1.3rem;  font-weight: 700; margin: 1.75rem 0 0.6rem; color: #0B1226; }
  .theory-content h3 { font-size: 1.1rem;  font-weight: 600; margin: 1.25rem 0 0.5rem; color: #0B1226; }
  .theory-content h4 { font-size: 1rem;    font-weight: 600; margin: 1rem 0 0.4rem; }
  .theory-content p  { margin-bottom: 1rem; }
  .theory-content ul, .theory-content ol { padding-left: 1.5rem; margin-bottom: 1rem; }
  .theory-content li { margin-bottom: 0.3rem; }
  .theory-content ul { list-style-type: disc; }
  .theory-content ol { list-style-type: decimal; }
  .theory-content strong { font-weight: 700; color: #0B1226; }
  .theory-content em { font-style: italic; }
  .theory-content a  { color: #2563EB; text-decoration: underline; text-underline-offset: 3px; }
  .theory-content code {
    background: rgba(11,18,38,0.07); padding: 0.15em 0.45em;
    border-radius: 5px; font-family: 'JetBrains Mono', monospace;
    font-size: 0.875em; color: #1D4ED8;
  }
  .theory-content pre {
    background: #0B1226; color: #E2E8F0;
    padding: 1.25rem 1.5rem; border-radius: 14px;
    overflow-x: auto; margin: 1.25rem 0; font-size: 0.875rem;
    line-height: 1.65; font-family: 'JetBrains Mono', monospace;
  }
  .theory-content pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
  .theory-content blockquote {
    border-left: 3px solid #2563EB; padding: 0.5rem 1rem;
    margin: 1rem 0; color: rgba(11,18,38,0.65); font-style: italic;
    background: rgba(37,99,235,0.04); border-radius: 0 8px 8px 0;
  }
  .theory-content table { width: 100%; border-collapse: collapse; margin-bottom: 1.25rem; font-size: 0.9rem; }
  .theory-content th, .theory-content td { border: 1px solid rgba(11,18,38,0.1); padding: 0.55rem 0.85rem; text-align: left; }
  .theory-content th { background: rgba(11,18,38,0.04); font-weight: 600; }
  .theory-content mark {
    background: #FDE68A;
    color: #0B1226;
    padding: 0.05em 0.28em;
    border-radius: 4px;
  }
  .theory-callout {
    background: #FFFBEB;
    border: 1px solid #FDE68A;
    border-radius: 16px;
    padding: 1rem 1.15rem;
    color: #78350F;
  }
  .theory-callout p:last-child { margin-bottom: 0; }
  .theory-figure {
    margin: 0;
    overflow: hidden;
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 0 0 1px rgba(11,18,38,0.06);
  }
  .theory-figure img {
    display: block;
    width: 100%;
    max-height: min(72vh, 720px);
    object-fit: contain;
    background: #fafafa;
  }
  .theory-figure figcaption {
    padding: 0.7rem 1rem 0.9rem;
    font-size: 13px;
    color: rgba(11,18,38,0.55);
    line-height: 1.45;
  }
  .theory-editor-text {
    min-height: 4.5rem;
    outline: none;
  }
  .theory-editor-text:empty:before {
    content: attr(data-placeholder);
    color: rgba(11,18,38,0.32);
    pointer-events: none;
  }
  .theory-drop-active {
    outline: 2px dashed #2563EB;
    outline-offset: 4px;
    background: rgba(37,99,235,0.04);
  }

  .avatar-ring {
    background: linear-gradient(135deg, var(--c-1), var(--c-3), var(--c-5));
    padding: 3px; border-radius: 999px;
  }

  input:focus, textarea:focus, button:focus { outline: none; }
  .ring-grad:focus-within {
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
    border-color: var(--c-2);
  }

  .auth-input-wrap {
    border: 1px solid rgba(11, 18, 38, 0.10);
    background: #fff;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .auth-input-wrap:focus-within {
    border-color: rgba(37, 99, 235, 0.45);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  .auth-input-wrap.is-error {
    border-color: rgba(244, 63, 94, 0.55);
    box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.08);
  }
  /* Chrome/Safari autofill paints a weird strip — neutralize it */
  .auth-input-wrap input:-webkit-autofill,
  .auth-input-wrap input:-webkit-autofill:hover,
  .auth-input-wrap input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--ink);
    caret-color: var(--ink);
    box-shadow: 0 0 0 1000px #fff inset;
    transition: background-color 99999s ease-out;
  }

  .whiteboard-root {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    pointer-events: auto !important;
    touch-action: none;
  }
  .whiteboard-root .tl-container {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    pointer-events: auto !important;
    touch-action: none;
  }
  .whiteboard-studio {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    min-height: 0;
    background: #f8fafc;
  }
  /* Chat Python code — Prism on dark panel */
  .chat-code-block {
    background: #0d1117 !important;
    color: #e6edf3 !important;
    margin: 0;
    border: 0;
    box-shadow: none;
  }
  .chat-code-block code,
  .chat-code-block .token {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    line-height: 1.55;
  }
  .chat-code-block ::selection,
  .chat-code-block *::selection {
    background: rgba(56, 189, 248, 0.45) !important;
    color: #f8fafc !important;
  }
</style>
