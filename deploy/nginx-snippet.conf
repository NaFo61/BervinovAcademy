# Справка для host nginx — academy.bervinov-miron.ru → 127.0.0.1:18080
#
# Доска живёт на этом же имени:
#   wss://academy.bervinov-miron.ru/whiteboard-sync/...
#   https://academy.bervinov-miron.ru/tldraw-assets/...
# Отдельный домен и порт 5858 не нужны: VPN, который пускает сайт, пускает и доску.
# Контейнерный nginx уже проксирует /whiteboard-sync/ на tldraw-sync.
# На хосте достаточно проксировать весь сайт на 18080 и не обрывать WebSocket.

upstream bervinov-academy {
    server 127.0.0.1:18080;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

