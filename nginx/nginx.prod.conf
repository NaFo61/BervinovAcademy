events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    client_max_body_size 55m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Bervinov Academy — served at site root (e.g. academy.bervinov-miron.ru).
    server {
        listen 18080;
        server_name _;

        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://backend:8000/admin/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WhiteNoise на backend отдаёт collectstatic; volume — запасной вариант
        location /static/ {
            proxy_pass http://backend:8000/static/;
            proxy_set_header Host $http_host;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /media/ {
            alias /var/www/django-media/;
            expires 1d;
            access_log off;
            add_header X-Content-Type-Options nosniff always;
            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/webp webp;
                image/gif gif;
                video/mp4 mp4;
                video/webm webm;
                video/quicktime mov;
            }
            default_type application/octet-stream;
            # если файла нет в volume — пробуем backend (редко)
            error_page 404 = @media_backend;
        }

        location @media_backend {
            proxy_pass http://backend:8000;
            proxy_set_header Host $http_host;
            add_header X-Content-Type-Options nosniff always;
        }

        location /ws/ {
            proxy_pass http://backend:8000/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }

        location /health/ {
            proxy_pass http://backend:8000/health/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # Service Worker must not fall through to SPA index.html
        location = /sw.js {
            root /usr/share/nginx/html;
            default_type application/javascript;
            add_header Cache-Control "no-cache";
            add_header Service-Worker-Allowed "/";
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
