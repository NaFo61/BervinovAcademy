<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560">
  <!--
    ????? ???? ?3 (?????? ?????!)
    ???????: A-B-C-D-E-H-A
    ??????: G ? A,E,F; F ? B,D,G
    ?????: AB BC CD DE EH HA  AG GE GF  BF FD
  -->
  <rect width="720" height="560" fill="#ffffff"/>
  <g stroke="#111111" stroke-width="2.2" stroke-linecap="round" fill="none">
    <line x1="160" y1="100" x2="400" y2="70"/>   <!-- A-B -->
    <line x1="400" y1="70"  x2="600" y2="190"/>  <!-- B-C -->
    <line x1="600" y1="190" x2="560" y2="420"/>  <!-- C-D -->
    <line x1="560" y1="420" x2="260" y2="480"/>  <!-- D-E -->
    <line x1="260" y1="480" x2="90"  y2="290"/>  <!-- E-H -->
    <line x1="90"  y1="290" x2="160" y2="100"/>  <!-- H-A -->
    <line x1="160" y1="100" x2="280" y2="250"/>  <!-- A-G -->
    <line x1="280" y1="250" x2="260" y2="480"/>  <!-- G-E -->
    <line x1="280" y1="250" x2="420" y2="300"/>  <!-- G-F -->
