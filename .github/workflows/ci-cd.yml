name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python tools
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pre-commit

      - name: Install frontend deps (eslint)
        working-directory: frontend
        run: npm ci

      - name: Pre-commit
        run: pre-commit run --all-files

      - name: Django system check
        working-directory: backend
        env:
          SECRET_KEY: ci-django-check-key
          DEBUG: "False"
        run: python manage.py check

      - name: No missing migrations
        working-directory: backend
        env:
          SECRET_KEY: ci-django-check-key
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: ":memory:"
        run: python manage.py makemigrations --check --dry-run

  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Compile translations
        working-directory: backend
        run: python manage.py compilemessages -l en

      - name: Migrate
        working-directory: backend
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: django-insecure-test-key-12345
        run: python manage.py migrate --noinput

      - name: Pytest
        # Override --reuse-db from pyproject: fresh DB on every CI run.
        # JUnit helps debug Postgres-only failures (SQLite often hides them).
        # Coverage: real --cov (artifact was previously empty).
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: django-insecure-test-key-12345
          DEBUG: "False"
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          COVERAGE_FILE: backend/.coverage
        run: >
          pytest -n auto --create-db
          --cov --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
          --junitxml=pytest-report.xml -ra

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage
          path: |
            backend/.coverage
            coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  docker-validate:
    name: Docker build (PR)
    needs: [lint, test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: bervinov-academy-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile.prod
          push: false
          load: true
          tags: bervinov-academy-nginx:ci
          build-args: |
            SUB_PATH=
            ENABLE_WHITEBOARD=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  build:
    name: Push to Docker Hub
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bervinov-academy-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bervinov-academy-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile.prod
          push: true
          build-args: |
            SUB_PATH=
            ENABLE_WHITEBOARD=true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bervinov-academy-nginx:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bervinov-academy-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push code-check-runner
        uses: docker/build-push-action@v6
        with:
          context: services/code_check_emulator
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bervinov-academy-code-check-runner:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bervinov-academy-code-check-runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push code-sandbox
        uses: docker/build-push-action@v6
        with:
          context: services/code_check_sandbox
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bervinov-academy-code-sandbox:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bervinov-academy-code-sandbox:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push tldraw-sync
        uses: docker/build-push-action@v6
        with:
          context: services/tldraw-sync
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bervinov-academy-tldraw-sync:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bervinov-academy-tldraw-sync:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/restart.sh,deploy/full-restart.sh,deploy/ci-deploy.sh,deploy/lib.sh"
          target: /opt/bervinov-academy
          strip_components: 1
          overwrite: true
          rm: false

      - name: Ensure deploy dir layout
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p /opt/bervinov-academy
            ls -la /opt/bervinov-academy
            test -f /opt/bervinov-academy/docker-compose.yml
            test -f /opt/bervinov-academy/restart.sh
            test -f /opt/bervinov-academy/ci-deploy.sh
            test -f /opt/bervinov-academy/lib.sh
            chmod +x /opt/bervinov-academy/restart.sh /opt/bervinov-academy/full-restart.sh /opt/bervinov-academy/ci-deploy.sh

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          FRONTEND_URL: https://academy.bervinov-miron.ru
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          envs: DOCKERHUB_USER,FRONTEND_URL
          script: |
            set -euo pipefail
            cd /opt/bervinov-academy
            chmod +x restart.sh full-restart.sh ci-deploy.sh
            ./ci-deploy.sh
