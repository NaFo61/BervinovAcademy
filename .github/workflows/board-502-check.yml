name: Board 502 check

# Read-only look at why the site returns 502. Does not wipe data.
# If the app behind nginx is stopped, start it again without deleting volumes.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    name: Check nginx and backend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Read server status
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 3m
          command_timeout: 8m
          script_stop: false
          script: |
            set +e
            cd /opt/bervinov-academy
            echo BEGIN
            date -u
            echo "--- resources ---"
            free -h
            uptime
            df -h /
            echo "--- nginx version ---"
            docker compose exec -T nginx nginx -v
            echo "--- compose ps ---"
            docker compose ps -a
            echo "--- backend inspect ---"
            docker inspect bervinov-academy-backend-1 --format 'status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{end}} restarts={{.RestartCount}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}'
            echo "--- nginx inspect ---"
            docker inspect bervinov-academy-nginx-1 --format 'status={{.State.Status}} restarts={{.RestartCount}} oom={{.State.OOMKilled}} started={{.State.StartedAt}}'
            echo "--- health from host ---"
            for i in 1 2 3 4 5 6 7 8; do
              code=$(curl -sS -m 4 -o /tmp/hbody.txt -w '%{http_code}' http://127.0.0.1:18080/health/ || echo ERR)
              echo "try $i $code $(head -c 180 /tmp/hbody.txt | tr '\n' ' ')"
            done
            echo "--- nginx errors ---"
            docker compose logs --since 45m nginx 2>&1 | grep -E 'emerg|error|upstream|502' | tail -n 80
            echo "--- backend tail ---"
            docker compose logs --since 45m backend 2>&1 | tail -n 120
            echo "--- host nginx errors ---"
            grep -E '502|upstream|connect\(\)' /var/log/nginx/error.log | tail -n 40
            echo "--- oom ---"
            dmesg -T 2>/dev/null | grep -i -E 'oom|killed process' | tail -n 20
            echo END
