name: SSH login repair

# Read-only SSH check. Does not deploy and does not touch the database.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    name: Diagnose SSH
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Read SSH logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 3m
          command_timeout: 8m
          script_stop: false
          script: |
            echo BEGIN
            echo "--- keys ---"
            ssh-keygen -lf /root/.ssh/authorized_keys || true
            awk '{print NR, $1, $NF}' /root/.ssh/authorized_keys || true
            echo "--- f2b settings ---"
            for k in bantime findtime maxretry banaction ignoreregex ignoreip; do
              printf '%s ' "$k"
              fail2ban-client get sshd "$k" || true
            done
            echo "--- jail files ---"
            grep -nEv '^[[:space:]]*#|^[[:space:]]*$' /etc/fail2ban/jail.local /etc/fail2ban/jail.d/*.conf /etc/fail2ban/jail.d/*.local 2>/dev/null || true
            echo "--- banned now ---"
            fail2ban-client get sshd banip || true
            echo "--- ban unban 12h ---"
            grep -E 'Ban |Unban ' /var/log/fail2ban.log | awk -v cut="$(date -u -d '12 hours ago' '+%Y-%m-%d %H:%M:%S')" '$1" "$2 >= cut' | tail -n 200 || true
            echo "--- accepted 30d ---"
            journalctl --since "-30d" -t sshd --no-pager | grep "Accepted publickey" | grep -oE 'from [0-9.]+' | sort | uniq -c | sort -nr || true
            echo "--- accepted lines ---"
            journalctl --since "-14d" -t sshd --no-pager | grep "Accepted publickey" | tail -n 40 || true
            echo "--- sshd problems 24h ---"
            journalctl --since "-24h" -t sshd --no-pager | grep -E 'drop connection|Unable to negotiate|Connection closed|fatal:|error:|maximum authentication|Did not receive identification|banner exchange|Timeout before authentication|Failed publickey' | tail -n 120 || true
            echo "--- iptables ssh ---"
            iptables -S | grep -Ei 'f2b|dport 22' | head -n 40 || true
            echo "--- personal history ---"
            journalctl --since "-30d" -t sshd --no-pager | grep -E '185\.77\.218\.|178\.155\.115\.' | awk '{print $1,$2,$3,$5}' | tail -n 40 || true
            echo "--- personal last accept ---"
            journalctl --since "-30d" -t sshd --no-pager | grep "Accepted publickey" | grep -E '185\.77\.218\.|178\.155\.115\.' | tail -n 10 || true
            echo "--- nft tables ---"
            nft list tables || true
            echo "--- nft f2b elements ---"
            nft list ruleset | grep -E '178\.155\.|185\.77\.|elements =|set |table |chain ' | head -n 80 || true
            echo "--- source limits ---"
            sshd -T | grep -i source || true
            echo "--- recent root logins ---"
            last -ai | head -n 20 || true
            echo END
            exit 0
